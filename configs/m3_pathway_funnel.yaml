# configs/m3_pathway_funnel.yaml — Pathway Discovery Funnel (CHANGES/0025)
# Status: DRAFT — owner sign-off required §0.3.9 before funnel is quoted as grant figure
# Purpose: Turn BioPathNet from gene ranker (MRR) into mechanism finder (pathway recall)
# Frozen decisions: KEEP graph (1,431,945), 1 pass, bio-layer message passing; this config is read-only post-approval.

status: "DRAFT — CHANGES/0025"

# Diseases to funnel: 2 LODO wind-tunnel controls + 1 open-world product query
diseases:
  - curie: "mondo:0010196"  # Werner syndrome — progeroid, WRN must be in Top-100 (positive control)
    mode: "lodo_keep"
    checkpoint: "reports/m2b/checkpoints_wave1/mondo__0010196_wave1_seed1337.pth"
  - curie: "mondo:0008310"  # Hutchinson-Gilford progeria — laminopathy, LMNA in Top-100
    mode: "lodo_keep"
    checkpoint: "reports/m2b/checkpoints_wave1/mondo__0008310_wave1_seed1337.pth"
  - curie: "mondo:0004975"  # Sporadic Alzheimer disease — OPEN WORLD (no holdout, full 1.43M, de novo)
    mode: "open_world_keep"
    checkpoint: null  # will be built by open-world inference on full graph
    note: "no valid/test split — scored by pathway support only, not MRR"

# Path extraction — read the reasoning trace, not just the destination
# Prior art: BioKGC/BioPathNet gradient-weighted path interpretation (Oleshko bioRxiv 2024 → Hu Nat Biomed Eng 2026) — we reuse verbatim, we do not claim novelty.
extraction:
  top_k_genes: 100                 # primary scored K — 100 catches rank~100 signal where WRN typically sits at MRR 0.007→rank 128
  top_k_sensitivity: [50, 100, 200] # P0 pre-registered sensitivity — report Recall@10 for K=50/100/200, no tuning
  path_topk: 10                    # BioPathNet beam width (model: path_topk=10, num_beam=10, hidden_dims [32x6])
  max_hops: 6                      # NBFNet depth — never exceed 6
  scoring: "gradient_weighted"     # grad(score(d,g)) w.r.t. path edge weights × PNA attention — filters hub bias vs raw attention
  scoring_note: "NBFNet has no transformer attention — 'attention' = PNA aggregator learned weights on messages; grad = autograd of sigmoid(score) w.r.t. path edge weight"
  min_path_score: 0.01             # drop near-zero PHE-GEN long tail
  dedup: "canonicalize_undirected" # GEN-GEN undirected — order-insensitive
  seed: 1337
  faithfulness_test: "mask_top_paths_drop" # P1: mask Top-10 scored paths per gene, re-score — prediction must drop (Jain & Wallace control)

# Owner amendment 2026-08-24 (1) — multi-seed consensus scoring (CHANGES/0025 amendment section)
# Consensus ranking = mean sigmoid score across seeds (tie-break gene idx); defines Top-K selection
# AND the positive-control gate. Path extraction runs per checkpoint for the consensus Top-K;
# aggregation/evaluate/report consume the pooled union. --checkpoint on the CLI disables this
# (single-checkpoint behavior, kept for the shuffle-collapse gate and debug).
consensus:
  enabled: true
  seeds: [1337, 1339, 5027]
  note: "missing seed ckpts are skipped with a warning so a 2-seed run works today"

# Owner amendment 2026-08-24 (2) — ontology-anchored EXPLORATORY variant (post-hoc, NOT the frozen endpoint)
# Candidates = GO BP / Reactome nodes with a direct train1 annotation edge to a consensus Top-K gene;
# score = (sum over top genes and seeds of best grad-weighted D->P prefix weight) / ln(degree(P)),
# same min_support 5 (sensitivity 3/5/10) and degree pin as the frozen aggregation.
anchored:
  enabled: true
  direct_annotation_suffix: true
  min_candidate_support: 3  # addendum 2026-08-25: prefilter before any GPU work — below the strictest reported min_support sensitivity (3) a candidate can never enter a reported table, so tables are identical to exhaustive (Werner: 3,239 -> 520 candidates)

# Intermediate -> pathway maps — these nodes are already in BRG message passing, we just cluster on them
# Prior art: Hetionet DWPC degree-weighted path count (Himmelstein eLife 2017) for hub penalty; GSEA/ORA (Subramanian PNAS 2005) for enrichment — we cite, we do not claim novelty.
maps:
  go_biological_process:           # BPO-GEN 158,410 edges, ~15k terms — REPORT RAW alongside hallmarks (no collapse to hallmarks only)
    source: "optimuskg_nodes_biological_process"
    id_prefix: "GO:"
    hallmarks_crosswalk: "docs/go_to_hallmarks.tsv"
    top_n_pathways: 30
  reactome:                        # PWY-GEN 46,977 edges — REPORT RAW alongside hallmarks
    source: "optimuskg_nodes_pathway"
    id_prefix: "R-HSA-"
    top_n_pathways: 30
  hallmarks_of_aging:              # 12 hallmarks (López-Otín 2013/2023) + MSigDB Hallmarks, 20-40 curated entries — COARSE, report separately
    source: "configs/hallmarks_of_aging.yaml"
    id_prefix: "HALLMARK_"
    weight_in_composite: 0.15     # exploratory ≤0.15 per §8.4B — reported separately, never collapsed

# Aggregation — how 1000 paths become 10 pathways
# Hub penalty = Hetionet DWPC descendant — degree(P) defined precisely below.
aggregation:
  method: "intermediate_pooled"
  score: "sum_gradient_weighted"   # pathway_score = Σ path_score for that GO/Reactome/Hallmark
  normalize: "hub_penalty_log_degree" # P0: degree(P) = total edges in train1 (1,431,945 KEEP) touching pathway node P (undirected degree in BRG)
  normalize_formula: "pathway_score(P) = Σ path_score / log(degree(P))" # log = natural log; sensitivity: on/off and log vs sqrt reported as supplement (P2)
  tie_break: "specificity"         # prefer deeper GO over root GO:0008150
  select: 10                       # Top-10 predicted pathways for scoring (figure shows Top-3)
  genes_per_pathway: 3             # Top-3 genes per pathway by max path_score through it
  min_support: 5                   # pathway must be hit by ≥5 of the 100 genes — sensitivity 3/5/10 reported (P2)
  figure_select: 3                 # for pathway_figure.png — 3 pathways radiating

# Pathway-level evaluation — grade the haystack color, not the needle rank
# Ground truth circularity disclosed: BPO-GEN/PWY-GEN are IN train1 for message passing (like GEN-GEN for gene task) — test is held-out at disease level, not ontology level. Mitigate: report raw GO + Reactome separately, and add independent MSigDB Hallmarks not derived from BPO/PWY as supplement if needed.
evaluation:
  ground_truth_source: "test_genes_only_go_reactome"
  ground_truth_min_genes: 3        # pathway must be hit by ≥3 test genes to be a true pathway — report NDCG@10 alongside Recall@10 for pleiotropic diseases (P1)
  metrics:                         # primary for funnel; gene MRR stays pre-registered primary for Wave 1
    - "pathway_recall@10"
    - "pathway_recall@5"
    - "pathway_mrr"
    - "pathway_precision@3"
    - "pathway_ndcg@10"            # P1: rank-aware, handles diseases with 500 true pathways without Recall collapse
  compare_to: ["degree_null_pathway_recall", "ora_hypergeometric_top100"] # P1: degree null must collapse 58-89%; ORA baseline must be beaten to prove grad-weighted topology adds value vs blind counting (Subramanian GSEA)
  baselines:                       # P1: Standard ORA on same Top-100 genes (hypergeometric, BH FDR) — same input, no paths
    ora_top100:
      method: "hypergeometric_enrichment"
      input: "top100_genes_flat_list" # treats 100 genes equally, no path scores
  significance: "hierarchical_bca_n1000"    # same as Wave 1 — BCa over diseases
  strata: ">2-hop"                  # P1: report pathway Recall@10 on >2-hop genes only — proves 6-layer reasoning beyond 2-hop SQL if it beats null

# Post-hoc annotation — not training, just wet-lab context (ANA-GEN 8.79M added back as label)
annotation:
  ana_gen_tissue: "optimuskg_edges_anatomy_gene"
  gene_properties: "data/processed/m1/gene_properties.parquet"
  add_to_table: ["tissue", "tractability", "safety_liabilities", "pocket_flag"]

# Guards — fail the run if violated
guards:
  max_rss_gb: 40
  no_neighborloader: true
  provenance: "funnel_provenance.json"  # every parquet carries seed + checkpoint SHA + config hash
  exact_repro: "resort_paths_sorted"
  positive_control: ["WRN in Werner Top-100", "LMNA in HGPS Top-100"] # gene-level gate, separate from pathway funnel — funnel is secondary, not rescue
  pathway_shuffle_collapse_gate: "pathway Recall@10 must collapse 58-89% on degree-preserving shuffles — halt if not (CHANGES/0022)" # P0: run before any grant quote
  pre_registered_sensitivity: "K=50/100/200 + hub on/off + grad vs uniform on 2 probes ×1 seed — report supplement, no gating"

# Outputs — all manifest-checked
outputs:
  paths_parquet: "data/processed/m3/pathways/{disease}__paths_top100.parquet"
  report: "reports/m2b/pathway_funnel.md"
  figure: "reports/m2b/pathway_figure.png"
  manifest: "data/raw/manifests/m3_pathway_funnel.json"
  benchmark_report: "reports/m2b/pathway_benchmark.md"  # pathway Recall@10 table vs gene MRR
