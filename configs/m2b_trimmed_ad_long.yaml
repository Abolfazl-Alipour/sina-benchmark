output_dir: /opt/sina/third_party/biopathnet/experiments/

dataset:
  class: biomedical
  path: /opt/sina/data/processed/m2/trimmed/biopathnet/trackd_family_alzheimer
  include_factgraph: True

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
    symmetric: no
  criterion: bce
  num_negative: 64
  strict_negative: yes
  adversarial_temperature: 1
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: True

optimizer:
  class: Adam
  lr: 1.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 300

train:
  num_epoch: 20

early_stop_patience: 20  # CHANGES/0017 (owner 2026-08-06): brake off — train all 20 epochs regardless of validation trajectory

metric: mrr
